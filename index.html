<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
</head>

<body>
    <header>
        <nav>
            <div class="nav-wrapper">
                <img src="#" alt="logo">
                <img src="#" alt="burger-menu">
            </div>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-wrapper">
            <div class="hero-background">
                <img src="#" alt="hero-background">
            </div>
            <div class="hero-logo">
                <img src="#" alt="hero-logo">
            </div>
            <div class="hero-headline">
                <h1>Burger<span>House</span></h1>
                <div class="hero-rating">
                    <img src="#" alt="rating-star">
                    <p><strong>4,1</strong>(317)</p>
                </div>
            </div>
            <div class="hero-underline">
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </div>
    </section>
    <main>
        <div class="main-wrapper">
            <section class="menu">
                <div class="menu-wrapper">
                    <div class="menu-burger">
                        <div class="menu-category">
                            <div class="menu-category-headline">
                                <img src="#" alt="burger">
                                <h2>Burger & Sandwiches</h2>
                            </div>
                        </div>
                        <div class="menu-card">

                        </div>
                    </div>
                    <div class="menu-pizza">
                        <div class="menu-category">
                            <div class="menu-category-headline">
                                <img src="#" alt="pizza">
                                <h2>Pizza (30cm)</h2>
                            </div>
                        </div>
                        <div class="menu-card">
                            
                        </div>
                    </div>
                    <div class="menu-salad">
                        <div class="menu-category">
                            <div class="menu-category-headline">
                                <img src="#" alt="salad">
                                <h2>Salad</h2>
                            </div>
                        </div>
                        <div class="menu-card">
                            
                        </div>
                    </div>
                </div>
            </section>
            <section class="basket">
                <div class="basket-wrapper">
                    <p>Your Basket</p>
                    <div class="basket-items">

                    </div>
                    <div class="basket-subtotal">
                        <p>Subtotal</p>
                        <p></p>
                    </div>
                    <div class="basket-delivery-fee">
                        <p>Delivery fee</p>
                        <p></p>
                    </div>
                    <div class="basket-total">
                        <p>Total</p>
                        <p></p>
                    </div>
                </div>
                <button>Buy Now (<p></p>)</button>
            </section>
        </div>
    </main>
    <footer>
        <div class="footer-wrapper">
            <div class="copyright-logo">
                <img src="#" alt="copyright-logo">
                <p>2025 BurgerHouse</p>
            </div>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
</body>

</html>
