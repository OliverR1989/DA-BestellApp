<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <link href="style.css" rel="stylesheet">
    <link href="./styles/basket.css" rel="stylesheet">
    <link href="./styles/components.css" rel="stylesheet">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
</head>

<body onload="init()">
    <header>
        <nav>
            <div class="nav-wrapper">
                <img src="./assets/icons/header-logo.png" alt="logo">
                <img src="./assets/icons/header-burger-menu.png" alt="burger-menu">
            </div>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-wrapper">
            <div class="hero-background">
            </div>
            <div class="hero-logo">
                <img src="./assets/icons/hero-logo.png" alt="hero-logo">
            </div>
            <div class="hero-headline">
                <h1>Burger<span>House</span></h1>
                <div class="hero-rating">
                    <img src="./assets/icons/hero-rating-star.png" alt="rating-star">
                    <p><strong>4,1</strong> (317)</p>
                </div>
            </div>
            <div class="hero-underline">
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </div>
    </section>
    <main>
        <div class="main-wrapper">
            <section class="menu">
                <div class="menu-wrapper">
                    <div id="menuCard">
                    </div>
                </div>
            </section>
            <section class="basket" id="basket">
            </section>
        </div>
    </main>
    <footer>
        <div class="footer-wrapper">
            <div class="copyright-logo">
                <img src="./assets/icons/footer-copyright.png" alt="copyright-logo">
                <p>2025 BurgerHouse</p>
            </div>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
